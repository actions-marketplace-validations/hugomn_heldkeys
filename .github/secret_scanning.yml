# GitHub secret scanning: paths whose credentials are deliberately fake.
#
# tests/fixtures holds the fake homes, projects and workflows the tests scan.
# Every token in it is a real prefix followed by obvious filler (FAKE, EXAMPLE)
# and none of them works. Excluding the directory keeps those tokens from
# raising alerts. Fake values in unit tests and docs stay scanned on purpose,
# so a real token pasted next to them is still caught.
paths-ignore:
  - "tests/fixtures/**"
