# HK-WF-001 (High): anyone can open an issue and the agent holds a write
# token. The ignore rule for it in .heldkeys.toml has expired.
on: issues
permissions:
  contents: write
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567 # v1.0.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: Label this issue.
