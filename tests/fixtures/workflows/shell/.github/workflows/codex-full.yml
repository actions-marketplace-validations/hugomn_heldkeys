# HK-WF-006: codex without a sandbox, token can write PRs.
on: push
permissions:
  contents: write
  pull-requests: write
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: {{fake:danger-|full-access}}
