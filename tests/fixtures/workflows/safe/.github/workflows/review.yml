# A well-configured agent workflow: trusted triggers, explicit read-mostly
# permissions, a pinned action, only the model key, and read-only tools
# (no command that runs code from the repository).
name: Claude review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@0123456789abcdef0123456789abcdef01234567 # v1.0.0
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep" --disallowedTools Bash
