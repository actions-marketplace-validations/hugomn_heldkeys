# HK-WF-001 (High) and HK-WF-004 through a local reusable workflow, as in
# run-gemini-cli's recommended setup: a dispatcher on comment and issue
# events calls the review workflow with secrets: inherit and write scopes.
name: Gemini Dispatch
on:
  pull_request_review_comment:
    types: ['created']
  issue_comment:
    types: ['created']
  issues:
    types: ['opened', 'reopened']
permissions:
  contents: read
jobs:
  review:
    if: contains(github.event.comment.body, '@gemini-cli /review')
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
