# HK-WF-001 (High): "not the bot" lets everyone else in, so it is no gate.
on:
  issues:
    types: [opened]
jobs:
  triage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567 # v1.0.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: Label this issue.
