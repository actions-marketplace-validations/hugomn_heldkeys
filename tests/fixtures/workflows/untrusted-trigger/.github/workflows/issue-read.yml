# HK-WF-001 (Medium): read-only token, but the model key can be exfiltrated.
on: issues
permissions:
  contents: read
  issues: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567 # v1.0.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: Label this issue.
