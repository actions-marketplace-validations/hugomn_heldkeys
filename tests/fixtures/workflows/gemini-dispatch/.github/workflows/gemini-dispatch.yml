# run-gemini-cli's dispatch template (google-github-actions/run-gemini-cli,
# examples/workflows), trimmed to the review command. The dispatch job only
# runs for same-repository PRs and for comments by an OWNER, MEMBER or
# COLLABORATOR; review needs dispatch, so it is skipped with it. Expected:
# HK-WF-001 Medium (gated through needs:), and `heldkeys ci` exits 0.
# Only secret names, no values.
name: '🔀 Gemini Dispatch'
on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']
defaults:
  run:
    shell: 'bash'
jobs:
  dispatch:
    if: |-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event.sender.type == 'User' && startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
    steps:
      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        with:
          script: |
            core.setOutput('command', 'review');
  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'
