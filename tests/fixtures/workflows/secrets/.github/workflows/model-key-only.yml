# Not HK-WF-004: the agent gets only its model key.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
