# HK-WF-004 (Medium): a job-level secret the agent step inherits.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - run: claude -p "Summarize the open issues"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
