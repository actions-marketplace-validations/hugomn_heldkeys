# Release configuration for cargo-dist (https://opensource.axo.dev/cargo-dist/).
#
# Nothing here runs by itself. To prepare the release workflow, a maintainer
# installs cargo-dist and runs `dist init` / `dist generate`, reviews the
# generated .github/workflows/release.yml (pin its actions to commit SHAs so
# it passes zizmor), and only then pushes a `v*` tag.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# Static musl binaries on Linux, which drop into any container or sandbox, and
# regular binaries for both macOS arches.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# A .sha256 file next to every archive, plus a combined sha256.sum.
checksum = "sha256"
installers = ["shell", "homebrew"]
# Formula is pushed to github.com/hugomn/homebrew-tap on release, using the
# HOMEBREW_TAP_TOKEN repository secret (a fine-grained token scoped to that repo).
tap = "hugomn/homebrew-tap"
formula = "heldkeys"
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
install-updater = false
# Pull requests only plan the release; they never build or publish.
pr-run-mode = "plan"
# release.yml is generated by `dist generate`, then every action is pinned to a
# full commit SHA by hand, so dist must not overwrite or reject the edit.
allow-dirty = ["ci"]
# GitHub build provenance for the archives.
github-attestations = true
