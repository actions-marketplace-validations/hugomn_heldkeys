# Release configuration for cargo-dist (https://opensource.axo.dev/cargo-dist/),
# used by .github/workflows/release.yml when a `v*` tag is pushed.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# Static musl binaries on Linux, which drop into any container or sandbox, and
# regular binaries for both macOS arches.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# A .sha256 file next to every archive, plus a combined sha256.sum.
checksum = "sha256"
installers = ["shell", "homebrew"]
# Formula is pushed to github.com/hugomn/homebrew-tap on release, using the
# HOMEBREW_TAP_TOKEN secret of the `release` environment (a fine-grained token
# scoped to that repo).
tap = "hugomn/homebrew-tap"
formula = "heldkeys"
# ./publish-crates is .github/workflows/publish-crates.yml: it publishes to
# crates.io with Trusted Publishing (a short-lived OIDC token, nothing stored).
publish-jobs = ["homebrew", "./publish-crates"]
# The job calling it needs id-token: write for the OIDC token, and contents:
# read because a called workflow cannot hold more than its caller grants.
github-custom-job-permissions = { "publish-crates" = { contents = "read", id-token = "write" } }
install-path = "CARGO_HOME"
install-updater = false
# Pull requests only plan the release; they never build or publish.
pr-run-mode = "plan"
# release.yml is generated by `dist generate` and then edited by hand: actions
# pinned to full commit SHAs, cargo-dist installed from a checksummed archive,
# least-privilege permissions. dist must not overwrite or reject those edits.
allow-dirty = ["ci"]
# GitHub build provenance for the archives.
github-attestations = true
