# The hardened counterpart of examples/vulnerable-agent-workflow.yml: an AI
# agent that reviews pull requests. heldkeys ci reports no HK-WF findings for
# it, and the comments say what each line buys and what risk is left.
#
# The trade-offs are deliberate. On pull requests from forks GitHub gives the
# job no secrets, so the agent only runs for branches in this repository and
# when a maintainer starts it by hand. And the agent cannot run commands that
# execute the repository's code (no npm test, no make), because a prompt
# injection in the pull request could change what those commands do. Run the
# tests in a separate job without the agent.
name: ai-review

on:
  # Trusted triggers only. pull_request from a fork gets a read-only token and
  # no secrets; issue_comment and pull_request_target would hand the agent
  # text from anyone together with this repository's secrets.
  pull_request:
  workflow_dispatch:

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the code; cannot push
      pull-requests: write # post the review comments; the agent can still do that when misled
    steps:
      # The default ref: on pull_request that is the merge commit GitHub
      # built, in a job that gets no secrets on forks. persist-credentials:
      # false keeps the job token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a full commit SHA with the version in a comment, so
      # Dependabot can still update it.
      - uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          # Only the model key. No cloud keys, no personal access tokens. The
          # agent can still be talked into misusing this key, so give it a
          # spend limit.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only file tools, two gh commands that only read the pull
          # request, and the action's tool for inline review comments. No
          # command here runs code from the repository, and shell commands
          # that are not on the list are refused.
          claude_args: --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
